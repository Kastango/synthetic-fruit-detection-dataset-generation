<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomar</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main style="max-width:560px;margin:12vh auto;padding:24px">
<h1>Prepare suas primeiras cenas</h1>
<p>Baixe seis fundos de árvores com mapas de profundidade e 32 recortes de poncãs para experimentar o gerador.</p>
<p>O kit de demonstração ocupa cerca de 7 MB. Ele não é o catálogo usado nos experimentos.</p>
<button id="download" class="primary">Baixar dados de demonstração</button>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script>
const button = document.querySelector('#download');
const status = document.querySelector('#status');
button.onclick = async () => {
  button.disabled = true;
  status.textContent = 'Preparando os dados…';
  try {
    const response = await fetch('/api/assets', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error);
    location.reload();
  } catch (error) {
    status.textContent = `${error.message} Confira a conexão e tente novamente.`;
    button.disabled = false;
  }
};
</script>
</body>
</html>
