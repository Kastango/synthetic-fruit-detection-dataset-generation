name: confirmatory_pool
seed: 42
images:
  train: 1040
  val: 260
canvas: [720, 960]
objects:
  min: 1
  max: 35
  min_scale: 0.035
  max_scale: 0.12
  scale_mode: canvas
  rotation_degrees: 180
placement:
  min_depth: 20
  min_visibility: 0.25
  max_attempts_per_object: 100
  z_method: quantile
  z_quantile: 0.65
appearance:
  # Ponto intermediário entre a baseline (0.65) e o trial007 (0.35, que
  # piorou o mAP real apesar de melhorar o FID). Mapeia a curva de resposta
  # do parâmetro em vez de só testar os extremos.
  hardlight_power: 0.5
occlusion:
  edge_blur: 1.5
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
