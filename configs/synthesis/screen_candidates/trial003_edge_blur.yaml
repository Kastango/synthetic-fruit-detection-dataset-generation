name: confirmatory_pool
seed: 42
images:
  train: 1040
  val: 260
canvas: [720, 960]
objects:
  min: 1
  # Herda o incumbente (trial001-density: 35->18, ~densidade real).
  max: 18
  min_scale: 0.035
  max_scale: 0.12
  scale_mode: canvas
  rotation_degrees: 180
placement:
  min_depth: 20
  min_visibility: 0.25
  max_attempts_per_object: 100
  z_method: quantile
  z_quantile: 0.65
appearance:
  hardlight_power: 0.65
occlusion:
  # Elevado de 1.5 para 3.5: transição de alfa mais suave nas bordas de
  # oclusão reduz artefatos de composição de borda dura, um driver conhecido
  # de gap sintético-real que o detector pode aprender a explorar.
  edge_blur: 3.5
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
