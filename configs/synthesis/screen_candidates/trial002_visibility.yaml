name: confirmatory_pool
seed: 42
images:
  train: 1040
  val: 260
canvas: [720, 960]
objects:
  min: 1
  # Herda o incumbente (trial001-density: 35->18, ~densidade real).
  max: 18
  min_scale: 0.035
  max_scale: 0.12
  scale_mode: canvas
  rotation_degrees: 180
placement:
  min_depth: 20
  # Elevado de 0.25 para 0.4: exige mais área visível após a oclusão antes de
  # manter a caixa, reduzindo instâncias parcialmente visíveis cuja anotação
  # é mais ambígua e pode prejudicar a localização.
  min_visibility: 0.4
  max_attempts_per_object: 100
  z_method: quantile
  z_quantile: 0.65
appearance:
  hardlight_power: 0.65
occlusion:
  edge_blur: 1.5
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
