name: confirmatory_pool
seed: 42
images:
  train: 1040
  val: 260
canvas: [720, 960]
objects:
  min: 1
  # Herda o incumbente (trial001-density: 35->18, ~densidade real).
  max: 18
  min_scale: 0.035
  max_scale: 0.12
  scale_mode: canvas
  rotation_degrees: 180
placement:
  min_depth: 20
  min_visibility: 0.25
  max_attempts_per_object: 100
  z_method: quantile
  # Reduzido de 0.65 para 0.5: corte de profundidade menos conservador para
  # decidir o que conta como "à frente"; testa se a oclusão fica mais
  # realista com um limiar mais próximo da mediana local.
  z_quantile: 0.5
appearance:
  hardlight_power: 0.65
occlusion:
  edge_blur: 1.5
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
