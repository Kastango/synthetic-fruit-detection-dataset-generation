name: confirmatory_pool
seed: 42
images:
  train: 1040
  val: 260
canvas: [720, 960]
objects:
  min: 1
  # Herda o incumbente (trial001-density: 35->18, ~densidade real).
  max: 18
  min_scale: 0.035
  max_scale: 0.12
  scale_mode: canvas
  rotation_degrees: 180
  # Modula o tamanho de referência (min_scale/max_scale) pela profundidade
  # local do ponto de inserção: mais claro/próximo -> até 1.3x maior; mais
  # escuro/distante -> até 0.7x menor. Aproxima o efeito de perspectiva das
  # fotos reais, sugerido a partir de um notebook de referência sobre escala
  # relativa ao mapa de profundidade.
  depth_scale:
    enabled: true
    near_scale: 1.3
    far_scale: 0.7
placement:
  min_depth: 20
  # Herda o incumbente da fase 2 (trial002): visibilidade mínima elevada.
  min_visibility: 0.4
  max_attempts_per_object: 100
  z_method: quantile
  z_quantile: 0.65
appearance:
  hardlight_power: 0.65
occlusion:
  edge_blur: 1.5
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
