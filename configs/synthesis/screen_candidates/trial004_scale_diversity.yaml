name: confirmatory_pool
seed: 42
images:
  train: 1040
  val: 260
canvas: [720, 960]
objects:
  min: 1
  # Herda o incumbente (trial001-density: 35->18, ~densidade real).
  max: 18
  # Faixa alargada de 0.035-0.12 para 0.025-0.16: mais diversidade de escala
  # aparente, aproximando a variação de distância de câmera observada nas
  # fotos reais e testando se isso melhora a robustez do detector.
  min_scale: 0.025
  max_scale: 0.16
  scale_mode: canvas
  rotation_degrees: 180
placement:
  min_depth: 20
  min_visibility: 0.25
  max_attempts_per_object: 100
  z_method: quantile
  z_quantile: 0.65
appearance:
  hardlight_power: 0.65
occlusion:
  edge_blur: 1.5
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
