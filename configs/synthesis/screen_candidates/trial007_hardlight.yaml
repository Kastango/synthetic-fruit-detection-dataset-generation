name: confirmatory_pool
seed: 42
images:
  train: 1040
  val: 260
canvas: [720, 960]
objects:
  min: 1
  max: 18
  min_scale: 0.035
  max_scale: 0.12
  scale_mode: canvas
  rotation_degrees: 180
placement:
  min_depth: 20
  # Herda o incumbente da fase 2 (trial002): visibilidade mínima elevada.
  min_visibility: 0.4
  max_attempts_per_object: 100
  z_method: quantile
  z_quantile: 0.65
appearance:
  # Reduzido de 0.65 para 0.35: menos blending força a cor do fundo sobre a
  # fruta, preservando mais textura/cor originais do recorte real. Blending
  # forte pode homogeneizar demais a aparência e apagar pistas discriminativas
  # que o detector precisa para generalizar a fotos reais.
  hardlight_power: 0.35
occlusion:
  edge_blur: 1.5
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
