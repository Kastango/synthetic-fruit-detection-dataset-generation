name: confirmatory_pool
seed: 42
images:
  train: 1040
  val: 260
canvas: [720, 960]
objects:
  min: 1
  # Nas 115 imagens reais de desenvolvimento há em média 16.1 frutas por
  # cena (mediana 15, q90 28). O intervalo uniforme 1–30 reproduz essa
  # densidade sem a cauda excessiva do limite anterior de 35.
  max: 30
  # O maior lado das caixas reais tem mediana 3.66% do canvas e q90 7.37%.
  # A faixa base abaixo, modulada pela profundidade local, produziu 4.17% e
  # 6.67% no lote sintético de inspeção (40 cenas).
  min_scale: 0.02
  max_scale: 0.065
  scale_mode: canvas
  # Revertido para 180 (valor original). Uma inspeção rápida sugeriu que
  # cicatriz-sempre-pra-cima seria mais realista, mas checando mais fotos
  # reais (img_2062.jpg, img_2058.jpg) o cabinho aparece em ângulos variados
  # ou nem fica visível — não há um "pra cima" canônico. Reduzir a rotação
  # também cortaria diversidade de pose que ajuda o YOLO a generalizar.
  rotation_degrees: 180
  depth_scale:
    enabled: true
    near_scale: 1.3
    far_scale: 0.6
placement:
  min_depth: 20
  min_visibility: 0.25
  max_attempts_per_object: 100
  # O Z vem da mediana de uma pequena vizinhança no ponto de ancoragem. O
  # quantil anterior sobre toda a silhueta impunha mecanicamente cerca de
  # 35% de oclusão a quase toda fruta, independentemente da geometria local.
  z_method: center_patch
  z_patch_fraction: 0.2
  # Negativo desloca o Z para longe da câmera, aumentando a oclusão: com
  # z_offset=10 a mediana de visibilidade por instância ficava em 89% (mais
  # de 25% das inserções saíam 100% visíveis, quase sem oclusão). -15 (44%
  # média/41% mediana) ficou pesado demais na inspeção visual do usuário; -4
  # sem jitter ficou bom na severidade média, mas um offset fixo desloca o
  # limiar igualmente em toda inserção — quase nenhuma fruta saía sem
  # nenhuma oclusão, porque a variação vinha só da geometria local (estreita).
  z_offset: -5
  # z_offset_jitter sorteia o offset por tentativa em [-5-30, -5+30]. Com
  # isso, 24% das inserções saem >=97% visíveis (era ~0% com offset fixo) e
  # a cauda pesada continua presente (p10=32%, p25=44%); média 67%/mediana
  # 63% (60 cenas, medido via fruit_pipeline.synthesis._finish_placement).
  z_offset_jitter: 30
  # A faixa inferior concentra chão/grama e fica fora da área de ancoragem.
  exclude_bottom_fraction: 0.15
appearance:
  hardlight_power: 0.65
  # O alvo hard-light varia por pixel e conserva a forma/sombra do recorte;
  # potências pequenas de H/S e moderada de V integram a fruta à luz local
  # sem deixá-la verde ou marrom. Dessaturação e offsets adicionais foram
  # rejeitados tanto visualmente quanto por KID pareado. Pesos elevados de
  # 0.08/0.12/0.35 para 0.12/0.18/0.45 a pedido do usuário, para reforçar a
  # coesão com a cena; confirmado visualmente sem reintroduzir o tingimento
  # esverdeado observado com pesos de matiz muito altos (>=0.3).
  hsv_cast:
    enabled: true
    use_hardlight_target: true
    hue_power: 0.12
    saturation_power: 0.18
    value_power: 0.45
    # value_power fixo dava a mesma resposta de luz/sombra pra toda fruta; o
    # usuário notou que a média está boa mas faltam frutas notavelmente mais
    # claras/escuras. 0.3 sorteia value_power por instância em [0.15,0.75],
    # aumentando o desvio padrão do brilho médio por fruta de 21.6 para 24.2
    # (60 cenas, medido pelo canal V de cada instância) sem mudar a média
    # (92.6 -> 93.6).
    value_power_jitter: 0.3
    # Sem piso, uma fruta ancorada numa região bem escura tinha o próprio
    # valor (V) puxado quase todo para o alvo escuro e "derretia" num blob
    # marrom irreconhecível (exemplo mandado pelo usuário). 0.6 mantém pelo
    # menos 60% do brilho original do pixel, então a fruta escurece na
    # sombra sem perder a cor identificável; não afeta regiões claras (onde
    # o alvo já é mais claro que o original).
    min_value_ratio: 0.6
    # Perto do céu (bg_v alto), a fruta real estoura de exposição e perde
    # relevo/saturação — o usuário pediu mais "achatamento" nessa faixa
    # especificamente. 0.7 empurra value/saturation_power em direção a 1.0
    # proporcionalmente ao brilho do alvo; em fundos médios/escuros
    # (bright_factor baixo) o efeito é desprezível.
    bright_flatten_strength: 0.7
occlusion:
  edge_blur: 1.5
  # Suaviza ruído fino do DepthPro antes de decidir a topologia da oclusão.
  depth_smooth_radius: 1.2
  # Como no notebook de origem: blur morfológico seguido de limiar binário.
  # Sem o limiar, o fundo vazava como manchas semitransparentes na fruta.
  mask_threshold: 0.5
  # edge_blur decide a FORMA da oclusão e é rebinarizado por mask_threshold;
  # sem mais nada isso deixa um corte geométrico abrupto (usuário notou e
  # pediu um gradiente na borda). Este segundo blur, bem menor, roda depois
  # do limiar e só amacia a serrilha de poucos pixels da borda já decidida.
  edge_feather_radius: 0.8
  # Folhas à frente projetam uma penumbra curta sobre a parte ainda visível.
  contact_shadow:
    enabled: true
    strength: 0.45
    radius_fraction: 0.04
  # Ideia do usuário: mesmo uma fruta sem oclusão geométrica pode ter uma
  # sombra de dossel caindo sobre ela. Sorteia um limiar de profundidade
  # independente do usado pra oclusão real (mesma estrutura local, formato
  # plausível), em 40% das inserções, e só escurece — não remove pixels.
  cast_shadow:
    enabled: true
    probability: 0.4
    strength: 0.3
    min_quantile: 0.25
    max_quantile: 0.6
    blur_radius: 3.0
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
  # Aplicado só ao fundo, antes das frutas. A calibração train+val mostrou
  # que o ajuste anterior tornava a cena neon (saturação mediana 146 e
  # desvio de luminância 64.6, contra 83.5 e 43.6 no real). Este ajuste
  # preserva a saturação, reduz a exposição dos fundos nublados e usa
  # nitidez discreta.
  scene_grading:
    enabled: true
    contrast: 1.2
    saturation: 1.0
    brightness: 0.82
    sharpen_radius: 2.0
    sharpen_percent: 25
    sharpen_threshold: 2
