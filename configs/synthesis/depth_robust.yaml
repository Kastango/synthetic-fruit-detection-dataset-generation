name: depth_robust
seed: 42
images:
  train: 1600
  val: 400
canvas: [1500, 2000]
objects:
  min: 1
  max: 35
  # Fração do menor lado do fundo, independente da resolução do recorte.
  min_scale: 0.035
  max_scale: 0.12
  scale_mode: canvas
  rotation_degrees: 180
placement:
  min_depth: 20
  min_visibility: 0.25
  max_attempts_per_object: 100
  z_method: quantile
  z_quantile: 0.65
appearance:
  hardlight_power: 0.65
occlusion:
  edge_blur: 1.5
annotation:
  # A caixa cobre apenas os pixels que continuam visíveis após a oclusão.
  mode: visible
  min_box_pixels: 4
output:
  jpeg_quality: 95
