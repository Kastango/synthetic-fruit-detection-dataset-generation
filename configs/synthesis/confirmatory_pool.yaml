name: confirmatory_pool
seed: 42
images:
  total: 1300
canvas:
- 720
- 960
objects:
  min: 1
  max: 30
  min_scale: 0.018
  max_scale: 0.1
  # Calibrado contra a distribuição de caixas do `manual-full`: lado maior
  # com p5 0,0201, mediana 0,0365 e p95 0,0893 da largura da imagem. O
  # sorteio é log-uniforme porque a distribuição real é assimétrica — a
  # mediana fica muito mais perto do p5 que do p95, e um sorteio uniforme
  # produziria fruta grande demais no centro da distribuição.
  scale_distribution: log-uniform
  rotation_degrees: 180
  dense:
    probability: 0.25
    min: 60
    max: 110
placement:
  min_depth: 20
  min_visibility: 0.15
  # Piso absoluto de fruta visível. A fração sozinha não basta: ela
  # correlaciona apenas 0,41 com a quantidade de fruta que sobrou, então
  # deixava passar caixas de 20 px² em que não há fruta visível alguma —
  # restos de fruta escondida atrás de outra. Cem pixels é o ponto em que
  # a fruta volta a ser reconhecível na inspeção visual.
  min_visible_pixels: 100
  max_attempts_per_object: 100
  z_patch_fraction: 0.2
  z_offset: -5
  z_offset_jitter: 30
  # Sem trava na faixa inferior: o CitDet anota muita fruta caída, e
  # proibir a base da imagem impedia o gerador de produzir essa categoria.
  exclude_bottom_fraction: 0.0
appearance:
  ripeness:
    enabled: true
    fraction_affected: 0.18
    green_hue_degrees: 85
    strength_range:
    - 0.25
    - 0.75
    saturation_scale: 0.8
    gloss_reduction: 0.4
  rot:
    # Fruta caída e apodrecida, que domina o gabarito do CitDet e que o
    # gerador não produzia: matiz para o marrom, dessaturada e mais escura.
    # Um fruto tem um estado só, então quem entra aqui não entra em ripeness.
    enabled: true
    fraction_affected: 0.12
    green_hue_degrees: 25
    strength_range:
    - 0.0
    - 0.9
    saturation_scale: 0.55
    value_scale: 0.6
    gloss_reduction: 0.8
    scale_with_strength: true
  exposure_jitter:
    enabled: true
    probability: 0.8
    range:
    - 0.4
    - 1.9
    saturation_pull: 0.35
  hsv_cast:
    use_hardlight_target: true
    hue_power: 0.12
    saturation_power: 0.18
    value_power: 0.45
    value_power_jitter: 0.3
    # Nem toda fruta adota a cor do ambiente na mesma medida: com o
    # valor fixo, fruta sob copa escura sempre saía escura, e nas fotos
    # reais há laranja nítida dentro de folhagem densa.
    strength_range:
    - 0.35
    - 1.0
    min_value_ratio: 0.15
    bright_flatten_strength: 0.7
occlusion:
  edge_blur: 1.5
  depth_smooth_radius: 1.2
  mask_threshold: 0.5
  edge_feather_radius: 0.8
  contact_shadow:
    strength: 0.45
    radius_fraction: 0.04
  cast_shadow:
    probability: 0.4
    strength: 0.4
    min_coverage: 0.3
    max_coverage: 0.6
    offset_fraction: 0.35
    light_angle_degrees: 315.0
    light_angle_jitter_degrees: 20.0
    blur_radius: 3.0
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
  scene_grading:
    contrast: 1.2
    saturation: 1.0
    brightness: 0.82
    sharpen_radius: 2.0
    sharpen_percent: 25
    sharpen_threshold: 2
