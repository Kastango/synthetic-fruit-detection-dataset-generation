name: confirmatory_pool
seed: 42
images:
  total: 1300
canvas: [720, 960]
objects:
  min: 1
  max: 30
  # Fração linear (sqrt(w*h)) do tamanho aparente da fruta. Calibrado contra
  # a distribuição real de caixas dos testes externos: cobre tanto o
  # tamanho típico do manual-full (câmera mais próxima) quanto o do CitDet
  # (câmera mais distante, frutos bem menores na imagem).
  min_scale: 0.01
  max_scale: 0.065
  scale_mode: canvas
  rotation_degrees: 180
  depth_scale:
    enabled: true
    near_scale: 1.3
    far_scale: 0.6
  # Pomares fotografados de longe (ex.: CitDet) mostram muito mais fruto por
  # imagem do que uma foto de perto (manual-full). Uma fração das cenas
  # sorteia desse range de densidade alta à parte, para o gerador cobrir os
  # dois regimes em vez de só o mais esparso. Teto limitado a 100 (não ao
  # máximo real de ~233): acima disso o RT-DETR estoura a VRAM da GPU
  # (atenção/denoising escalam com nº de instâncias por imagem, diferente
  # do YOLO), então o teto aqui é o maior valor estável para os três
  # detectores, não o maior valor realista.
  dense:
    probability: 0.25
    min: 60
    max: 100
placement:
  min_depth: 20
  min_visibility: 0.15
  max_attempts_per_object: 100
  z_method: center_patch
  z_patch_fraction: 0.2
  z_offset: -5
  z_offset_jitter: 30
  exclude_bottom_fraction: 0.15
appearance:
  hardlight_power: 0.65
  # Os recortes-fonte são fotos de fruta madura; sem isso, o pool sintético
  # nunca teria fruta verde/em maturação, embora pomares reais tenham. Gira
  # o matiz de uma fração dos objetos em direção a um verde-amarelado (mais
  # "de vez" que folha), com força e saturação moderadas para não colidir
  # cromaticamente com a folhagem real ao redor, e acha o brilho especular
  # (fruta madura é mais cerosa que a "de vez"). Aplicado antes do hsv_cast
  # ambiental, que continua respondendo à luz da cena por cima.
  # Ver fruit_pipeline/synthesis.py:_apply_ripeness_shift.
  ripeness:
    enabled: true
    fraction_affected: 0.18
    green_hue_degrees: 85
    strength_range: [0.25, 0.75]
    saturation_scale: 0.8
    gloss_reduction: 0.4
  hsv_cast:
    enabled: true
    use_hardlight_target: true
    hue_power: 0.12
    saturation_power: 0.18
    value_power: 0.45
    value_power_jitter: 0.3
    min_value_ratio: 0.6
    bright_flatten_strength: 0.7
occlusion:
  edge_blur: 1.5
  depth_smooth_radius: 1.2
  mask_threshold: 0.5
  edge_feather_radius: 0.8
  contact_shadow:
    enabled: true
    strength: 0.45
    radius_fraction: 0.04
  cast_shadow:
    enabled: true
    probability: 0.4
    strength: 0.4
    min_coverage: 0.3
    max_coverage: 0.6
    offset_fraction: 0.35
    light_angle_degrees: 315.0
    light_angle_jitter_degrees: 20.0
    blur_radius: 3.0
annotation:
  mode: visible
  min_box_pixels: 2
output:
  jpeg_quality: 95
  scene_grading:
    enabled: true
    contrast: 1.2
    saturation: 1.0
    brightness: 0.82
    sharpen_radius: 2.0
    sharpen_percent: 25
    sharpen_threshold: 2
