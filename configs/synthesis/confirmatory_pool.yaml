name: confirmatory_pool
seed: 42
images:
  total: 1300
canvas:
- 720
- 960

sampling:
  # Semente de cena derivada de (semente raiz, impressão dos ativos, índice da
  # cena). Sem isso a semente depende do hash da configuração, e qualquer
  # ajuste embaralharia todas as cenas — o que impede comparar duas receitas
  # cena a cena.
  mode: paired-v1

objects:
  # Mínimo observado nos dois domínios. O máximo é o teto definido pelo usuário.
  min: 1
  max: 60
  # Beta limitada a [1,60], ajustada pelos momentos da mistura 50/50:
  # média 14,443; variância 123,207 (desvio 11,100) frutas por imagem.
  # O arredondamento discretiza a amostra; rejeições podem reduzir a entrega.
  count_distribution:
    mode: beta
    alpha: 0.90471226
    beta: 3.06598030
  # Negativos deliberados, em fluxo aleatório independente.
  empty_probability: 0.01
  # Centro de escala por cena, relativo ao menor lado do canvas.
  # Faixa ampliada para frutas maiores e mais variedade entre enquadramentos.
  min_scale: 0.018
  max_scale: 0.15
  scale_distribution: log-uniform
  scene_scale:
    # Mantém moderada a variação entre frutas da mesma cena.
    spread: 2.24
  rotation_degrees: 180

placement:
  min_depth: 20
  # Piso escolhido pelo usuário, verificado também após as oclusões finais.
  min_visibility: 0.15
  # Quantidade mínima de pixels de máscara visível, não lado de caixa.
  min_visible_pixels: 60
  max_attempts_per_object: 100
  z_patch_fraction: 0.2
  z_offset: -7
  z_offset_jitter: 30
  # Sem trava na faixa inferior: fruta cai, e uma foto de copa costuma pegar o
  # chão. Proibir a base da imagem impedia essa categoria.
  exclude_bottom_fraction: 0.0

annotation:
  mode: visible
  min_box_pixels: 2

augmentation:
  # Os recortes-fonte são poucos e reaparecem muitas vezes no pool. Espelhar
  # metade deles dobra o repertório de silhueta sem inventar fruta.
  horizontal_flip: 0.5

appearance:
  ripeness:
    # Os recortes-fonte foram fotografados só em ponto de colheita. Sem esta
    # etapa nenhuma fruta sintética fica verde, mesmo com o pomar real tendo
    # fruto em vários estágios.
    enabled: true
    fraction_affected: 0.25
    green_hue_degrees: 85
    # Gradiente contínuo: a fruta sorteada se espalha entre nenhum verde e o
    # teto, e saturação e brilho acompanham a mesma intensidade.
    strength_range:
    - 0.0
    - 0.8
    scale_with_strength: true
    saturation_scale: 0.8
    gloss_reduction: 0.4
  rot:
    # Fruta apodrecida, que o gerador não produzia: matiz para o marrom,
    # dessaturada e mais escura. Um fruto tem um estado só, então quem entra
    # aqui não entra em ripeness. Peso a rever contra o gabarito vigente.
    enabled: true
    fraction_affected: 0.12
    green_hue_degrees: 25
    strength_range:
    - 0.0
    - 0.9
    scale_with_strength: true
    saturation_scale: 0.55
    value_scale: 0.6
    gloss_reduction: 0.8
  hsv_cast:
    # Puxa matiz e saturação da fruta na direção da cor do fundo local, sem
    # apagar o relevo próprio dela.
    hue_power: 0.12
    saturation_power: 0.18
    value_power: 0.78
    value_power_jitter: 0.3
    use_hardlight_target: true
    bright_flatten_strength: 0.7
    min_value_ratio: 0.15
    # Multiplicador por instância: com influência fixa, toda fruta sob copa
    # escura sai escura. Nas fotos reais há fruta laranja mesmo em folhagem
    # densa, porque pegou um facho de luz.
    strength_range:
    - 0.35
    - 1.0
  exposure_jitter:
    # O hsv_cast só sabe REDUZIR o contraste entre fruta e cena. Um fator de
    # exposição por instância é o único ponto capaz de abrir as duas caudas.
    enabled: true
    probability: 0.8
    range:
    - 0.82
    - 1.27
    saturation_pull: 0.35

occlusion:
  mask_threshold: 0.5
  edge_blur: 1.5
  edge_feather_radius: 0.8
  depth_smooth_radius: 1.2
  contact_shadow:
    radius_fraction: 0.04
    strength: 0.8
  cast_shadow:
    probability: 0.4
    strength: 0.4
    blur_radius: 3.0
    min_coverage: 0.3
    max_coverage: 0.6
    offset_fraction: 0.35
    light_angle_degrees: 270.0
    light_angle_jitter_degrees: 90.0
    # Uma direção de luz por cena, em vez de uma para o pool inteiro: dentro
    # de uma foto o sol vem de um lado só, entre fotos ele muda.
    light_angle_per_scene: true

output:
  jpeg_quality: 95
  scene_grading:
    brightness: 1.08
    contrast: 1.15
    saturation: 1.06
    sharpen_radius: 2.0
    sharpen_percent: 6
    sharpen_threshold: 2
    # Multiplicadores sorteados por cena, cada eixo no seu próprio fluxo. Os
    # fundos foram fotografados sob luz difusa e saem quase uniformes: a
    # amplitude p5-p95 do pool é 19,0 em brilho e 17,1 em contraste, contra
    # 32,5/30,3 no treino manual.
    brightness_jitter:
    - 0.9
    - 1.1
    contrast_jitter:
    - 0.85
    - 1.15
    saturation_jitter:
    - 0.85
    - 1.15
    sharpen_percent_jitter:
    - 0.2
    - 1.8
