external_datasets:
  # Laranja em árvore, sete celulares, nove condições de tempo e hora, cinco
  # cultivares do verde ao maduro. O protocolo de anotação é escrito: uma
  # caixa por fruto, fruto com mais de ~80% de oclusão não é anotado, fruto
  # pequeno ou borrado demais para identificação é descartado. Não há classe
  # de fruta no chão.
  oranges_field:
    landing_page: https://data.mendeley.com/datasets/93f32zgkxz/1
    download_url: https://data.mendeley.com/public-api/zip/93f32zgkxz/download/1
    archive_name: oranges-in-the-field.zip
    expected_bytes: 812649381
    sha256: 5400227ae218eacd6f060b982f83c4d56258bef66779a46dc0ff8b770b298e35
    annotation_format: yolo
    collapse_to_single_class: true
    license: CC BY-NC 3.0
    # O pacote traz 5.025 recortes 640x640 de 865 fotos. O teste usa o
    # subconjunto de `scripts/curate_oranges_field.py`: fora os recortes em que
    # uma fruta ocupa mais de 1/4 do quadro (não há copa para procurar nela) e
    # no máximo 250 recortes por condição de luz, percorrendo as fotos de
    # origem em rodadas. Nenhum critério olha para a coleta própria.
    curation: scripts/curate_oranges_field.py --teto 0.25 --cap 250 --seed 42
    expected_images: 1243
    expected_boxes: 15893
    citation: >-
      Carella et al. (2026). Large-scale orange fruit dataset for
      localization, classification and ripening assessment under varying
      environments. Computers and Electronics in Agriculture 248, 111833.
  manual_full_val:
    landing_page: null
    license: interno (coleta própria do projeto)
    download_url: null
    archive_name: null
    annotation_format: yolo
    expected_images: 26
    expected_boxes: 463
    collapse_to_single_class: true

