project:
  seed: 42
  class_names: [poncan]

paths:
  archives: data/archives
  raw: data/raw
  assets: data/assets/prepared
  regenerated_assets: data/assets/regenerated
  real_source: data/real_source
  real_yolo: data/real_yolo
  generated: data/generated
  artifacts: artifacts
  runs: runs

real_dataset:
  expected_images: 130
  expected_boxes: 2093
  train_images: 100
  val_images: 15
  test_images: 15
  devices: [iphone, pixel]

asset_split:
  train_ratio: 0.8
  seed: 42

depth:
  # DepthPro (Apple, 2024) traça bordas finas de vegetação com muito mais
  # detalhe que o ZoeDepth (checkpoint anterior, mantido no histórico do
  # git). Confirmado por inspeção visual direta: o mapa antigo classificava
  # névoa/chão próximos da câmera como mais "perto" que o tronco da árvore
  # e não capturava galhos/folhas individuais; o DepthPro resolve os dois
  # problemas na mesma foto de teste (IMG_3509.jpg). Requer
  # transformers>=5 (model_type "depth_pro" não existe em 4.x).
  model: apple/DepthPro-hf
  revision: de816c8ce7168afcb231f96d501d72b869d0beda
  prediction_is_distance: true
  lower_percentile: 2.0
  # DepthPro prevê distância métrica real e tem cauda longa (pixels de céu
  # às vezes leem 800+ metros); 98 deixava o percentil superior tão alto
  # que toda a vegetação relevante (2-10m) ficava espremida perto de 255.
  # 85 preserva gradiente de cinza na folhagem/tronco próximos, que é o que
  # importa para colocação e oclusão. Testado em IMG_3509.jpg.
  upper_percentile: 85.0
  closest_is_white: true

segmentation:
  model: isnet-general-use
  alpha_threshold: 8
  output_size: 1024
