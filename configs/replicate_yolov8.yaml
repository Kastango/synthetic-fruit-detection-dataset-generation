protocol:
  artifact_subdir: replicate_yolov8
  runs_subdir: replicate_yolov8
  ultralytics_version: 8.4.121
  validation: data/real_yolo_confirmatory/images/val
  external_test: citdet
  test: data/external_tests/citdet/images/test
  class_names:
  - poncan
conditions:
  paired_reference:
    train:
    - data/generated/paired_reference/images/train
    validation: data/generated/paired_reference/images/val
    manifests:
    - data/generated/paired_reference/manifest.jsonl
    - data/generated/paired_reference/generation_config.json
models:
- name: yolov8s
  checkpoint: yolov8s.pt
  parameters:
    batch: 8
    nbs: 8
    optimizer: SGD
    lr0: 0.01
    deterministic: true
seeds:
- 43
- 44
defaults:
  epochs: 50
  patience: 30
  close_mosaic: 5
  imgsz: 960
  amp: true
  pretrained: true
  max_det: 1000
  device: cuda
  cache: false
  multi_scale: 0.0
  weight_decay: 0.0005
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
